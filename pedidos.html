<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14A152"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Cpath d=%22M16 2.5C8.5 2.5 2.5 8.3 2.5 15.5c0 2.6.8 5 2.1 7L3 28.5l6.3-1.6A13.7 13.7 0 0 0 16 28.5c7.5 0 13.5-5.8 13.5-13S23.5 2.5 16 2.5z%22 fill=%22%2314A152%22/%3E%3C/svg%3E"><link rel="stylesheet" href="app.css"><script src="config.js"></script><script src="app.js"></script><title>Pedidos — IA ZAP</title></head><body>
<script>
if (!requireAuth()) throw new Error('auth');
const COLS = [['novo', 'Novos'], ['confirmado', 'Confirmados'], ['preparo', 'Em preparo'], ['saiu', 'Saiu para entrega'], ['pronto', 'Pronto para retirada'], ['entregue', 'Entregues (24 h)'], ['cancelado', 'Cancelados (24 h)']];
const PROX = { novo: ['confirmado', 'Confirmar'], confirmado: ['preparo', 'Em preparo'], preparo: [null, null], saiu: ['entregue', 'Entregue'], pronto: ['entregue', 'Retirado'] };
let pedidos = [], ultimoTotal = null;
(async () => {
  const me = await loadMe();
  renderShell('pedidos', { title: 'Pedidos' });
  if (me.account.modelo !== 'delivery') { q('content').innerHTML = '<div class="notice">Este número não usa pedidos.</div>'; return; }
  q('topbar-actions').innerHTML = '<label class="check" title="Avisa o cliente pelo WhatsApp a cada mudança"><input type="checkbox" id="av" checked>Avisar cliente</label><button class="btn btn-primary" onclick="novoPedido()">' + icon('plus', 16) + ' Novo pedido</button>';
  q('content').innerHTML = '<div class="kanban" id="kb"><div class="spinner"></div></div>';
  carregar(); setInterval(() => !document.hidden && carregar(), 10000);
})();
async function carregar() {
  try {
    const r = await api('/api/pedidos'); pedidos = r.pedidos;
    const novos = pedidos.filter(p => p.status === 'novo').length;
    if (ultimoTotal !== null && novos > ultimoTotal) { toast('Novo pedido!', 'ok'); try { new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=').play(); } catch { } }
    ultimoTotal = novos;
    q('kb').innerHTML = COLS.map(([k, l]) => { const ps = pedidos.filter(p => p.status === k);
      return '<div class="kcol"><h4>' + l + '<span class="soft">' + ps.length + '</span></h4>' + ps.map(card).join('') + '</div>'; }).join('');
  } catch (e) { toast(e.message, 'err'); }
}
function card(p) {
  const prox = p.status === 'preparo' ? (p.tipo === 'entrega' ? ['saiu', 'Saiu para entrega'] : ['pronto', 'Pronto']) : PROX[p.status] || [null, null];
  return `<div class="kcard"><div style="display:flex;justify-content:space-between"><b>#${p.codigo} ${escapeHtml(p.cliente_nome || '')}</b><span class="small soft">${fmtRel(p.criado_em)}</span></div>
    ${p.teste ? '<span class="tag" style="background:var(--warn-lt);color:var(--warn)">teste</span>' : ''}
    <div class="it">${p.itens.map(i => i.quantidade + 'x ' + escapeHtml(i.nome) + (i.adicionais.length ? ' (+ ' + i.adicionais.map(a => escapeHtml(a.nome)).join(', ') + ')' : '') + (i.observacao ? ' · ' + escapeHtml(i.observacao) : '')).join('<br>')}</div>
    <div class="small">${p.tipo === 'entrega' ? '🛵 ' + escapeHtml(p.endereco || '') : '🏪 Retirada'}</div>
    <div class="small" style="margin-top:4px"><b>${fmtMoney(p.total_centavos)}</b> · ${escapeHtml(p.forma_pagamento || '')}${p.troco_para_centavos ? ' · troco para ' + fmtMoney(p.troco_para_centavos) : ''}</div>
    ${p.observacao ? '<div class="small soft">Obs.: ' + escapeHtml(p.observacao) + '</div>' : ''}
    <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap">${prox[0] ? '<button class="btn btn-sm btn-primary" onclick="mudar(\'' + p.id + '\',\'' + prox[0] + '\')">' + prox[1] + '</button>' : ''}
      ${!['entregue', 'cancelado'].includes(p.status) ? '<button class="btn btn-sm btn-ghost" onclick="mudar(\'' + p.id + '\',\'cancelado\')">Cancelar</button>' : ''}
      ${p.contact_id && !p.teste ? '<a class="btn btn-sm btn-ghost" href="inbox.html?c=' + p.contact_id + '">Conversa</a>' : ''}</div></div>`;
}
let cardapio = null;
window.novoPedido = async () => {
  if (!cardapio) cardapio = (await api('/api/produtos')).produtos.filter(p => p.ativo);
  const biz = (await api('/api/business')).business; const formas = biz.formas_pagamento || [];
  let itens = [];
  openModal(`<div class="row"><div class="field"><label for="pn">Cliente</label><input class="input" id="pn" placeholder="Nome"></div><div class="field"><label for="pt">WhatsApp</label><input class="input" id="pt" inputmode="tel" placeholder="Opcional, para avisar"></div></div>
    <div class="field"><label for="pp">Adicionar item</label><div style="display:flex;gap:8px"><select class="select" id="pp">${cardapio.map(p => '<option value="' + p.id + '">' + escapeHtml(p.nome) + ' · ' + fmtMoney(p.preco_promo_centavos || p.preco_centavos) + '</option>').join('')}</select><input type="number" min="1" value="1" class="input" id="pq" style="width:70px"><button class="btn" id="padd">Adicionar</button></div><div id="pads" class="checks" style="margin-top:6px"></div></div>
    <div id="plist" class="small"></div>
    <div class="row"><div class="field"><label for="ptp">Tipo</label><select class="select" id="ptp"><option value="entrega">Entrega</option><option value="retirada">Retirada</option></select></div><div class="field"><label for="pf">Pagamento</label><select class="select" id="pf"><option value="">Escolha</option>${formas.map(f => '<option>' + escapeHtml(f) + '</option>').join('')}</select></div></div>
    <div class="field" id="pend"><label for="pe">Endereço</label><input class="input" id="pe"></div>
    <div class="row"><div class="field"><label for="ptr">Troco para (R$)</label><input class="input" id="ptr" inputmode="decimal"></div><div class="field"><label for="po">Observação</label><input class="input" id="po"></div></div>
    <label class="check"><input type="checkbox" id="pav" checked>Enviar o resumo para o cliente no WhatsApp</label>`, { title: 'Novo pedido', wide: true, footer: '<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" id="pgo">Registrar pedido</button>' });
  const rAds = () => { const p = cardapio.find(x => x.id === q('pp').value); q('pads').innerHTML = (p?.atributos.adicionais || []).map(a => '<label class="check"><input type="checkbox" value="' + escapeHtml(a.nome) + '">' + escapeHtml(a.nome) + ' +' + fmtMoney(a.preco_centavos) + '</label>').join(''); };
  const rList = () => { q('plist').innerHTML = itens.map((it, i) => { const p = cardapio.find(x => x.id === it.produto_id); return '<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)"><span>' + it.quantidade + 'x ' + escapeHtml(p.nome) + (it.adicionais.length ? ' (+ ' + it.adicionais.map(escapeHtml).join(', ') + ')' : '') + '</span><button class="btn btn-sm btn-ghost" onclick="remItem(' + i + ')">Remover</button></div>'; }).join('') || '<span class="soft">Nenhum item.</span>'; };
  window.remItem = (i) => { itens.splice(i, 1); rList(); };
  q('pp').onchange = rAds; rAds(); rList();
  q('ptp').onchange = () => q('pend').style.display = q('ptp').value === 'entrega' ? '' : 'none';
  q('padd').onclick = () => { itens.push({ produto_id: q('pp').value, quantidade: +q('pq').value || 1, adicionais: [...document.querySelectorAll('#pads input:checked')].map(i => i.value) }); q('pq').value = 1; rAds(); rList(); };
  q('pgo').onclick = async (ev) => {
    btnLoading(ev.currentTarget, true, 'Registrando…');
    try { const r = await api('/api/pedidos', { method: 'POST', body: { nome: q('pn').value, telefone: q('pt').value, itens, tipo: q('ptp').value, endereco: q('pe').value, forma_pagamento: q('pf').value, troco_para: parseMoney(q('ptr').value) / 100 || null, observacao: q('po').value, avisar: q('pav').checked } });
      closeModal(); toast('Pedido #' + r.codigo + ' registrado' + (r.avisado ? ' e cliente avisado' : ''), 'ok'); carregar(); } catch (e) { toast(e.message, 'err'); btnLoading(null, false); }
  };
};
window.mudar = async (id, status) => {
  if (status === 'cancelado' && !confirm('Cancelar este pedido?')) return;
  try { const r = await api('/api/pedidos/' + id, { method: 'PATCH', body: { status, avisar: q('av').checked } }); toast(r.avisado ? 'Status atualizado e cliente avisado' : 'Status atualizado', 'ok'); carregar(); } catch (e) { toast(e.message, 'err'); }
};
</script></body></html>
