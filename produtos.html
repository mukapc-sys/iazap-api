<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14A152"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Cpath d=%22M16 2.5C8.5 2.5 2.5 8.3 2.5 15.5c0 2.6.8 5 2.1 7L3 28.5l6.3-1.6A13.7 13.7 0 0 0 16 28.5c7.5 0 13.5-5.8 13.5-13S23.5 2.5 16 2.5z%22 fill=%22%2314A152%22/%3E%3C/svg%3E"><link rel="stylesheet" href="app.css"><script src="config.js"></script><script src="app.js"></script><title>Catálogo — IA ZAP</title></head><body>
<script>
if (!requireAuth()) throw new Error('auth');
let me, lista = [], cats = [], busca = '';
const SEG = () => me.account.modelo;
const ROT = () => ({ imobiliaria: ['Imóveis', 'imóvel', 'Novo imóvel'], delivery: ['Cardápio', 'item', 'Novo item'] }[SEG()] || ['Produtos', 'produto', 'Novo produto']);
(async () => {
  me = await loadMe();
  renderShell('produtos', { title: ROT()[0] });
  if (!['delivery', 'varejo', 'imobiliaria', 'ecommerce'].includes(SEG())) { q('content').innerHTML = '<div class="notice">Este número não usa catálogo.</div>'; return; }
  q('topbar-actions').innerHTML = '<button class="btn btn-primary" onclick="editar()">' + icon('plus', 16) + ' ' + ROT()[2] + '</button>';
  q('content').innerHTML = '<div class="page" style="max-width:1200px">' + (SEG() === 'delivery' ? '<div class="panel" id="cdp"></div>' : '') + '<div style="display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap"><input class="input" id="bq" placeholder="Buscar" style="max-width:320px"><select class="select" id="bc" style="max-width:220px"><option value="">Todas as categorias</option></select></div><div class="prod-grid" id="gr"><div class="spinner"></div></div></div>';
  let t; q('bq').oninput = () => { clearTimeout(t); t = setTimeout(carregar, 250); }; q('bc').onchange = carregar;
  carregar();
  if (SEG() === 'delivery') painelCardapio();
})();
async function painelCardapio() {
  try {
    const r = await api('/api/cardapio');
    const base = new URL('.', location.href).href;
    q('cdp').innerHTML = `<div class="panel-head"><div><h3>Cardápio digital</h3><p>Página em que o cliente monta o pedido como num app e envia pelo WhatsApp. A IA confere e finaliza. Use no Instagram, no Google e em QR Code na mesa ou na embalagem.</p></div>
      <label class="switch"><input type="checkbox" id="cd-on" ${r.ativo ? 'checked' : ''}><span></span></label></div>
      ${r.ativo ? `<div class="panel-body" style="display:flex;gap:18px;flex-wrap:wrap;align-items:center">
        <div id="cd-qr" style="background:#fff;padding:8px;border-radius:8px;border:1px solid var(--line)"></div>
        <div style="flex:1;min-width:260px"><div style="display:flex;gap:8px;flex-wrap:wrap"><input class="input" readonly id="cd-l" value="${escapeHtml(r.url || '')}" style="flex:1;min-width:220px"><button class="btn" id="cd-c">Copiar</button><a class="btn btn-primary" href="${escapeHtml(r.url || '#')}" target="_blank" rel="noopener">Abrir</a></div>
          <div style="display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap"><span class="small soft">Endereço:</span><input class="input" id="cd-s" value="${escapeHtml(r.slug || '')}" style="max-width:220px;padding:6px 10px"><button class="btn btn-sm" id="cd-sv">Salvar endereço</button></div>
          <div class="small soft" style="margin-top:8px">${r.whatsapp ? 'O botão do cardápio abre o WhatsApp deste número com o pedido pronto.' : 'WhatsApp não conectado: o botão do cardápio envia para a sala de teste (se estiver ligada).'} A IA também manda este link quando o cliente pede o cardápio.</div>
          <button class="btn btn-sm" style="margin-top:8px" id="cd-dl">Baixar QR Code</button></div></div>` : ''}`;
    q('cd-on').onchange = async (e) => { try { await api('/api/cardapio', { method: 'PATCH', body: { ativo: e.target.checked, base_url: base } }); toast(e.target.checked ? 'Cardápio digital ligado' : 'Cardápio digital desligado', 'ok'); painelCardapio(); } catch (err) { toast(err.message, 'err'); e.target.checked = !e.target.checked; } };
    if (r.ativo) {
      if (!r.url) { await api('/api/cardapio', { method: 'PATCH', body: { ativo: true, base_url: base } }); return painelCardapio(); }
      q('cd-c').onclick = () => navigator.clipboard.writeText(r.url).then(() => toast('Link copiado', 'ok'));
      q('cd-sv').onclick = async () => { try { const x = await api('/api/cardapio', { method: 'PATCH', body: { slug: q('cd-s').value } }); toast('Endereço salvo: ' + x.url, 'ok'); painelCardapio(); } catch (e) { toast(e.message, 'err'); } };
      const desenhar = () => { q('cd-qr').innerHTML = ''; new QRCode(q('cd-qr'), { text: r.url, width: 132, height: 132, correctLevel: QRCode.CorrectLevel.M }); };
      if (window.QRCode) desenhar(); else { const sc = document.createElement('script'); sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js'; sc.onload = desenhar; document.head.appendChild(sc); }
      q('cd-dl').onclick = () => { const c = q('cd-qr').querySelector('canvas'); if (!c) return; const big = document.createElement('div'); new QRCode(big, { text: r.url, width: 1024, height: 1024, correctLevel: QRCode.CorrectLevel.M }); setTimeout(() => { const a = document.createElement('a'); a.download = 'qrcode-cardapio.png'; a.href = big.querySelector('canvas').toDataURL('image/png'); a.click(); }, 150); };
    }
  } catch (e) { q('cdp').innerHTML = '<div class="panel-body"><div class="notice notice-err" style="margin:0">' + escapeHtml(e.message) + '</div></div>'; }
}
async function carregar() {
  try {
    const p = new URLSearchParams(); if (q('bq').value.trim()) p.set('q', q('bq').value.trim()); if (q('bc').value) p.set('categoria', q('bc').value);
    const r = await api('/api/produtos?' + p); lista = r.produtos; cats = r.categorias;
    const sel = q('bc').value; q('bc').innerHTML = '<option value="">Todas as categorias</option>' + cats.map(c => '<option ' + (c.categoria === sel ? 'selected' : '') + '>' + escapeHtml(c.categoria) + '</option>').join('');
    q('gr').innerHTML = lista.length ? lista.map(pr => `<div class="prod ${pr.ativo ? '' : 'off'}" onclick="editar('${pr.id}')">
      <div class="prod-img">${pr.foto_urls[0] ? '<img src="' + escapeHtml(pr.foto_urls[0]) + '" alt="" loading="lazy">' : icon('camera', 28)}</div>
      <div class="prod-body"><b>${escapeHtml(pr.nome)}</b><div class="small soft">${escapeHtml(pr.categoria || '')}</div>
        <div style="margin-top:6px">${pr.preco_promo_centavos ? '<s class="soft small">' + fmtMoney(pr.preco_centavos) + '</s> <b style="display:inline">' + fmtMoney(pr.preco_promo_centavos) + '</b>' : '<b style="display:inline">' + fmtMoney(pr.preco_centavos) + '</b>'}${SEG() === 'imobiliaria' && pr.atributos.finalidade === 'aluguel' ? '<span class="small soft">/mês</span>' : ''}</div>
        <div style="margin-top:6px">${pr.destaque ? '<span class="tag">destaque</span>' : ''}${pr.estoque !== null ? '<span class="tag">' + (pr.estoque > 0 ? pr.estoque + ' em estoque' : 'esgotado') + '</span>' : ''}${pr.ativo ? '' : '<span class="tag">inativo</span>'}</div></div></div>`).join('')
      : '<div class="empty" style="grid-column:1/-1"><b>Nada cadastrado</b>Cadastre os ' + ROT()[0].toLowerCase() + ' que a IA vai oferecer.</div>';
  } catch (e) { toast(e.message, 'err'); }
}
const CAMPOS_ATRIB = {
  imobiliaria: [['finalidade', 'Finalidade', 'venda ou aluguel'], ['tipo', 'Tipo', 'casa, apartamento…'], ['bairro', 'Bairro'], ['quartos', 'Quartos'], ['banheiros', 'Banheiros'], ['vagas', 'Vagas'], ['area_m2', 'Área (m²)'], ['condominio', 'Condomínio'], ['iptu', 'IPTU']],
  varejo: [['tamanhos', 'Tamanhos', 'P, M, G'], ['cores', 'Cores']], ecommerce: [['sabores', 'Variações', 'ex.: sabores, voltagem']], delivery: [],
};
window.editar = (id) => {
  const pr = lista.find(x => x.id === id) || { nome: '', descricao: '', categoria: '', preco_centavos: 0, preco_promo_centavos: null, estoque: null, ativo: 1, destaque: 0, fotos: [], foto_urls: [], atributos: {}, link_externo: '' };
  let fotos = pr.fotos.map((k, i) => ({ key: k, url: pr.foto_urls[i] }));
  let adicionais = (pr.atributos.adicionais || []).map(a => ({ ...a }));
  const at = CAMPOS_ATRIB[SEG()] || [];
  openModal(`
    <div class="field"><label>Fotos</label><div class="fotos-edit" id="pf"></div><input type="file" id="pff" class="hidden" accept="image/*" multiple></div>
    <div class="row"><div class="field"><label for="pn">Nome</label><input class="input" id="pn" value="${escapeHtml(pr.nome)}"></div>
      <div class="field"><label for="pc">Categoria</label><input class="input" id="pc" list="pcl" value="${escapeHtml(pr.categoria || '')}"><datalist id="pcl">${cats.map(c => '<option value="' + escapeHtml(c.categoria) + '">').join('')}</datalist></div></div>
    <div class="row-3"><div class="field"><label for="pp">Preço (R$)${SEG() === 'imobiliaria' ? ' <span class="soft small">(aluguel: valor mensal)</span>' : ''}</label><input class="input" id="pp" inputmode="decimal" value="${pr.preco_centavos ? (pr.preco_centavos / 100).toFixed(2).replace('.', ',') : ''}"></div>
      <div class="field"><label for="ppr">Preço promocional</label><input class="input" id="ppr" inputmode="decimal" value="${pr.preco_promo_centavos ? (pr.preco_promo_centavos / 100).toFixed(2).replace('.', ',') : ''}"></div>
      <div class="field"><label for="pe">Estoque</label><input type="number" min="0" class="input" id="pe" value="${pr.estoque ?? ''}" placeholder="Sem controle"></div></div>
    <div class="field"><label for="pd">Descrição</label><textarea class="textarea" id="pd" placeholder="A IA usa para explicar e recomendar">${escapeHtml(pr.descricao || '')}</textarea></div>
    ${at.length ? '<div class="row-3">' + at.map(([k, l, ph]) => '<div class="field"><label>' + l + '</label><input class="input" data-at="' + k + '" value="' + escapeHtml(pr.atributos[k] ?? '') + '" placeholder="' + (ph || '') + '"></div>').join('') + '</div>' : ''}
    ${SEG() === 'delivery' ? '<div class="field"><label>Adicionais</label><div id="pad"></div><button type="button" class="btn btn-sm" id="padd">Adicionar opção</button></div>' : ''}
    ${SEG() !== 'delivery' ? '<div class="field"><label for="pl">Link</label><input class="input" id="pl" value="' + escapeHtml(pr.link_externo || '') + '" placeholder="' + (SEG() === 'ecommerce' ? 'Link de compra no site' : 'Opcional: anúncio, tour virtual…') + '"></div>' : ''}
    <div class="checks"><label class="check"><input type="checkbox" id="pdt" ${pr.destaque ? 'checked' : ''}>Destaque</label>${id ? '<label class="check"><input type="checkbox" id="pat" ' + (pr.ativo ? 'checked' : '') + '>Ativo</label>' : ''}</div>`,
    { title: id ? 'Editar ' + ROT()[1] : ROT()[2], wide: true, footer: (id ? '<button class="btn btn-danger" style="margin-right:auto" id="pdel">Excluir</button>' : '') + '<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" id="pgo">Salvar</button>' });
  const rFotos = () => { q('pf').innerHTML = fotos.map((f, i) => '<div class="f"><img src="' + escapeHtml(f.url) + '" alt=""><button type="button" data-i="' + i + '" aria-label="Remover foto">×</button></div>').join('') + (fotos.length < 8 ? '<button type="button" class="add" id="pfa">' + icon('plus', 20) + '</button>' : '');
    q('pf').querySelectorAll('.f button').forEach(b => b.onclick = () => { fotos.splice(+b.dataset.i, 1); rFotos(); }); if (q('pfa')) q('pfa').onclick = () => q('pff').click(); };
  rFotos();
  q('pff').onchange = async (e) => { for (const f of [...e.target.files].slice(0, 8 - fotos.length)) { try { const up = await uploadArquivo(f, 'produto', { maxLado: 1200 }); fotos.push({ key: up.key, url: up.url }); rFotos(); } catch (err) { toast(err.message, 'err'); } } e.target.value = ''; };
  const rAd = () => { if (!q('pad')) return; q('pad').innerHTML = adicionais.map((a, i) => '<div style="display:flex;gap:6px;margin-bottom:6px"><input class="input ad-n" value="' + escapeHtml(a.nome) + '" placeholder="Ex.: Borda catupiry"><input class="input ad-p" style="width:120px" inputmode="decimal" value="' + (a.preco_centavos ? (a.preco_centavos / 100).toFixed(2).replace('.', ',') : '') + '" placeholder="R$"><button type="button" class="btn btn-sm btn-ghost" data-i="' + i + '">×</button></div>').join('');
    q('pad').querySelectorAll('button').forEach(b => b.onclick = () => { lerAd(); adicionais.splice(+b.dataset.i, 1); rAd(); }); };
  const lerAd = () => { if (!q('pad')) return; const ns = [...document.querySelectorAll('.ad-n')], ps = [...document.querySelectorAll('.ad-p')]; adicionais = ns.map((n, i) => ({ nome: n.value.trim(), preco_centavos: parseMoney(ps[i].value) })).filter(a => a.nome); };
  rAd(); if (q('padd')) q('padd').onclick = () => { lerAd(); adicionais.push({ nome: '', preco_centavos: 0 }); rAd(); };
  q('pgo').onclick = async (ev) => {
    lerAd();
    const atributos = { ...pr.atributos }; document.querySelectorAll('[data-at]').forEach(i => { const v = i.value.trim(); if (v) atributos[i.dataset.at] = /^\d+$/.test(v) && ['quartos', 'banheiros', 'vagas', 'area_m2'].includes(i.dataset.at) ? +v : v; else delete atributos[i.dataset.at]; });
    if (SEG() === 'delivery') atributos.adicionais = adicionais;
    const body = { nome: q('pn').value, categoria: q('pc').value, preco_centavos: parseMoney(q('pp').value), preco_promo_centavos: parseMoney(q('ppr').value) || null, estoque: q('pe').value === '' ? null : +q('pe').value,
      descricao: q('pd').value, atributos, link_externo: q('pl')?.value || '', destaque: q('pdt').checked, ativo: id ? q('pat').checked : true, fotos: fotos.map(f => f.key) };
    btnLoading(ev.currentTarget, true, 'Salvando…');
    try { await api('/api/produtos' + (id ? '/' + id : ''), { method: id ? 'PUT' : 'POST', body }); closeModal(); toast('Salvo', 'ok'); carregar(); } catch (e) { toast(e.message, 'err'); btnLoading(null, false); }
  };
  if (q('pdel')) q('pdel').onclick = async () => { if (!confirm('Excluir? Se já estiver em pedidos, fica só inativo.')) return; try { const r = await api('/api/produtos/' + id, { method: 'DELETE' }); closeModal(); toast(r.desativado ? 'Desativado' : 'Excluído', 'ok'); carregar(); } catch (e) { toast(e.message, 'err'); } };
};
</script></body></html>
