<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14A152"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Cpath d=%22M16 2.5C8.5 2.5 2.5 8.3 2.5 15.5c0 2.6.8 5 2.1 7L3 28.5l6.3-1.6A13.7 13.7 0 0 0 16 28.5c7.5 0 13.5-5.8 13.5-13S23.5 2.5 16 2.5z%22 fill=%22%2314A152%22/%3E%3C/svg%3E"><link rel="stylesheet" href="app.css"><script src="config.js"></script><script src="app.js"></script><title>Vendas e suporte — Admin IA ZAP</title></head><body>
<div id="root"></div><div id="toast"></div>
<script>
const AK = { get: () => sessionStorage.getItem('iz_admin') || '' };
if (!AK.get()) location.href = 'admin.html';
const adm = (path, opts = {}) => api('/api/admin' + path, { ...opts, noAuth: true, headers: { 'X-Admin-Key': AK.get() } });
const SUB = { ativa: ['Ativa', 'pill-ok'], atrasada: ['Atrasada', 'pill-warn'], cancelada: ['Cancelada', ''], reembolsada: ['Reembolsada', 'pill-err'] };
let aba = new URLSearchParams(location.search).get('aba') || 'assinaturas';
q('root').innerHTML = `<header class="topbar">${logoHTML()}<div class="topbar-actions"><a class="btn btn-ghost" href="admin.html">Voltar para contas</a></div></header>
  <div class="page" style="max-width:1150px"><div class="tabs2" id="tabs"></div><div id="area"><div class="spinner"></div></div></div>`;
function abrir(a) { aba = a; history.replaceState(null, '', '?aba=' + a);
  q('tabs').innerHTML = [['assinaturas', 'Assinaturas'], ['ia', 'IA e consumo'], ['planos', 'Planos (Hotmart)'], ['suporte', 'Suporte'], ['config', 'Configurações']].map(([k, l]) => '<button class="' + (k === a ? 'on' : '') + '" onclick="abrir(\'' + k + '\')">' + l + '</button>').join('');
  ({ assinaturas, ia, planos, suporte, config })[a]().catch(e => q('area').innerHTML = '<div class="notice notice-err">' + escapeHtml(e.message) + '</div>'); }
window.abrir = abrir; abrir(aba);

async function assinaturas() {
  const r = await adm('/assinaturas'); const s = r.resumo;
  q('area').innerHTML = `<div class="stats" style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px">
    ${[['Contas pagantes', s.contas_ativas], ['Pagamentos atrasados', s.atrasadas], ['Bloqueadas (Hotmart)', s.bloqueadas], ['Novas em 30 dias', s.novas_30d]].map(([l, v]) => '<div class="panel" style="padding:14px;margin:0"><div class="small soft">' + l + '</div><div style="font-size:26px;font-weight:700;color:var(--ink)">' + v + '</div></div>').join('')}</div>
    <div class="panel" style="overflow-x:auto"><table class="tbl"><thead><tr><th>Conta</th><th>Plano</th><th>Status</th><th>Acesso até</th><th>Atualizada</th><th></th></tr></thead><tbody>
    ${r.assinaturas.map(a => '<tr><td><b style="color:var(--ink)">' + escapeHtml(a.conta) + '</b><div class="small soft">' + escapeHtml(a.email || '') + '</div></td><td class="small">' + escapeHtml(a.plano) + (a.tipo === 'extra' ? ' <span class="tag">extra</span>' : '') + '</td><td><span class="pill ' + (SUB[a.status] || ['', ''])[1] + '">' + (SUB[a.status] || [a.status])[0] + '</span>' + (a.conta_status === 'bloqueado' ? ' <span class="pill pill-err">conta bloqueada</span>' : '') + '</td><td class="small">' + (a.acesso_ate ? fmtDate(a.acesso_ate) : '—') + '</td><td class="small">' + fmtRel(a.atualizado_em) + '</td><td><button class="btn btn-sm" onclick="reenviar(\'' + a.id + '\')">Reenviar acesso</button></td></tr>').join('') || '<tr><td colspan="6"><div class="empty"><b>Nenhuma assinatura ainda</b>Cadastre os planos e o webhook da Hotmart.</div></td></tr>'}
    </tbody></table></div>
    <div class="section-title">Eventos recebidos da Hotmart</div>
    <div class="panel" style="overflow-x:auto"><table class="tbl"><thead><tr><th>Quando</th><th>Evento</th><th>Comprador</th><th>Produto / oferta</th><th>Resultado</th></tr></thead><tbody>
    ${r.logs.map(l => '<tr><td class="small">' + fmtDate(l.criado_em) + '</td><td class="small"><code>' + escapeHtml(l.evento) + '</code></td><td class="small">' + escapeHtml(l.email || '') + '</td><td class="small">' + escapeHtml(l.produto || '') + (l.oferta ? ' / ' + escapeHtml(l.oferta) : '') + '</td><td class="small">' + escapeHtml(l.resultado || '') + '</td></tr>').join('') || '<tr><td colspan="5"><div class="empty">Nenhum evento</div></td></tr>'}</tbody></table></div>`;
}
window.reenviar = async (id) => { try { const r = await adm('/assinaturas/' + id + '/reenviar-acesso', { method: 'POST' }); openModal('<p>E-mail: <b>' + (r.email ? 'enviado' : 'não enviado') + '</b> · WhatsApp: <b>' + (r.whats ? 'enviado' : 'não enviado') + '</b></p><input class="input" readonly value="' + escapeHtml(r.link) + '">', { title: 'Link de acesso', footer: '<button class="btn btn-primary" onclick="closeModal()">Fechar</button>' }); } catch (e) { toast(e.message, 'err'); } };

const BRL = (v) => (v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL', minimumFractionDigits: 2 });
const NUM = (v) => (v || 0).toLocaleString('pt-BR');
async function ia() {
  const r = await adm('/ia');
  const opcoes = (sel, comPadrao) => (comPadrao ? '<option value="">Padrão (' + escapeHtml(r.modelo_padrao) + ')</option>' : '') + r.modelos.map(m => '<option value="' + escapeHtml(m.id) + '" ' + (m.id === sel ? 'selected' : '') + '>' + escapeHtml(m.id) + '</option>').join('') + (sel && !r.modelos.some(m => m.id === sel) ? '<option selected>' + escapeHtml(sel) + '</option>' : '');
  q('area').innerHTML = `
    ${r.chave_configurada ? '' : '<div class="notice notice-err">A chave da plataforma não está configurada. No Worker: Settings → Variables and Secrets → adicione o secret <code>GEMINI_KEY</code> com a chave do Google AI Studio.</div>'}
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px">
      ${[['Custo estimado no mês', BRL(r.total_mes)], ['Projeção para 30 dias', BRL(r.projecao_mes)], ['Respostas da IA no mês', NUM(r.respostas_mes)], ['Custo médio por resposta', r.respostas_mes ? BRL(r.total_mes / r.respostas_mes) : '—']].map(([l, v]) => '<div class="panel" style="padding:14px;margin:0"><div class="small soft">' + l + '</div><div style="font-size:24px;font-weight:700;color:var(--ink)">' + v + '</div></div>').join('')}
    </div>
    <div class="panel"><div class="panel-head"><div><h3>Modelo padrão</h3><p>Usado por todas as contas que não têm um modelo definido abaixo. Contas novas nascem nele.</p></div></div>
      <div class="panel-body" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><select class="select" id="mp" style="max-width:320px">${opcoes(r.modelo_padrao, false)}</select><button class="btn btn-primary" id="mpgo">Salvar padrão</button>
      <button class="btn btn-ghost" id="prgo">Preços e câmbio</button></div></div>
    <div class="panel" style="overflow-x:auto"><table class="tbl"><thead><tr><th>Conta</th><th>Modelo</th><th style="text-align:right">Respostas no mês</th><th style="text-align:right">Tokens (entrada / saída)</th><th style="text-align:right">Custo no mês</th><th style="text-align:right">Por resposta</th><th style="text-align:right">Mês anterior</th></tr></thead><tbody>
      ${r.contas.map(c => `<tr>
        <td><b style="color:var(--ink)">${escapeHtml(c.nome)}</b>${c.status !== 'ativo' ? ' <span class="pill">' + escapeHtml(c.status) + '</span>' : ''}
          ${c.numeros.length ? '<div class="small soft">' + c.numeros.map(n => escapeHtml(n.nome) + ': ' + NUM(n.respostas) + ' · ' + BRL(n.custo)).join(' · ') + '</div>' : ''}</td>
        <td><select class="select" style="padding:5px 8px;min-width:220px" onchange="mudaModelo('${c.id}', this.value)">${opcoes(c.modelo_admin || '', true)}</select></td>
        <td style="text-align:right">${NUM(c.mes.respostas)}</td>
        <td style="text-align:right" class="small">${NUM(c.mes.tokens_in)} / ${NUM(c.mes.tokens_out)}</td>
        <td style="text-align:right;font-weight:700;color:${c.mes.custo > 40 ? 'var(--danger)' : 'var(--ink)'}">${BRL(c.mes.custo)}</td>
        <td style="text-align:right" class="small">${c.mes.respostas ? BRL(c.custo_por_resposta) : '—'}</td>
        <td style="text-align:right" class="small">${BRL(c.mes_anterior.custo)}</td></tr>`).join('') || '<tr><td colspan="7"><div class="empty">Nenhuma conta</div></td></tr>'}
    </tbody></table></div>
    <p class="small soft">Custos estimados pelos tokens registrados em cada chamada (respostas, memória, textos automáticos, PDFs e sala de teste), com os preços e o câmbio configurados. A fatura oficial é a do Google. Em vermelho: contas acima de R$ 40 no mês.</p>`;
  q('mpgo').onclick = async () => { try { await adm('/ia', { method: 'PUT', body: { modelo_padrao: q('mp').value } }); toast('Modelo padrão salvo', 'ok'); ia(); } catch (e) { toast(e.message, 'err'); } };
  q('prgo').onclick = () => {
    const linhas = Object.entries(r.precos).map(([k, v]) => '<tr><td><input class="input pr-k" value="' + escapeHtml(k) + '"></td><td><input class="input pr-i" value="' + v.in + '"></td><td><input class="input pr-o" value="' + v.out + '"></td><td><input class="input pr-c" value="' + v.cache + '"></td></tr>').join('');
    openModal('<p class="small soft" style="margin-top:0">Dólares por 1 milhão de tokens. O modelo é identificado pelo começo do nome; "*" vale para os não listados. Tokens de raciocínio contam como saída.</p><div class="field" style="max-width:200px"><label for="cb">Câmbio (R$ por US$)</label><input class="input" id="cb" value="' + r.cambio + '"></div><table class="tbl"><thead><tr><th>Modelo</th><th>Entrada</th><th>Saída</th><th>Cache</th></tr></thead><tbody id="prt">' + linhas + '<tr><td><input class="input pr-k" placeholder="novo modelo"></td><td><input class="input pr-i"></td><td><input class="input pr-o"></td><td><input class="input pr-c"></td></tr></tbody></table>',
      { title: 'Preços dos modelos', wide: true, footer: '<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" id="prs">Salvar</button>' });
    q('prs').onclick = async () => {
      const precos = {}; const ks = [...document.querySelectorAll('.pr-k')], is = [...document.querySelectorAll('.pr-i')], os = [...document.querySelectorAll('.pr-o')], cs = [...document.querySelectorAll('.pr-c')];
      ks.forEach((k, i) => { const n = k.value.trim(); if (n) precos[n] = { in: parseFloat(String(is[i].value).replace(',', '.')) || 0, out: parseFloat(String(os[i].value).replace(',', '.')) || 0, cache: parseFloat(String(cs[i].value).replace(',', '.')) || 0 }; });
      try { await adm('/ia', { method: 'PUT', body: { precos, cambio: parseFloat(String(q('cb').value).replace(',', '.')) } }); closeModal(); toast('Preços salvos', 'ok'); ia(); } catch (e) { toast(e.message, 'err'); }
    };
  };
}
window.mudaModelo = async (id, modelo) => { try { await adm('/ia/contas/' + id, { method: 'PATCH', body: { modelo } }); toast(modelo ? 'Conta passa a usar ' + modelo : 'Conta volta ao modelo padrão', 'ok'); } catch (e) { toast(e.message, 'err'); } };

async function planos() {
  const r = await adm('/planos');
  q('area').innerHTML = `<p class="muted" style="margin-top:0">Cada produto (ou oferta) da Hotmart vira um plano. <b>Principal</b> define quantos números a conta tem; <b>Número extra</b> soma números enquanto a assinatura extra estiver ativa. Se o mesmo produto tem ofertas com quantidades diferentes, cadastre uma linha por oferta.</p>
    <div style="margin-bottom:12px"><button class="btn btn-primary" onclick="plano()">${icon('plus', 16)} Novo plano</button></div>
    <div class="panel" style="overflow-x:auto"><table class="tbl"><thead><tr><th>Plano</th><th>Tipo</th><th>Produto Hotmart</th><th>Oferta</th><th>Números</th><th>Assinaturas ativas</th><th></th></tr></thead><tbody>
    ${r.planos.map(p => '<tr class="' + (p.ativo ? '' : 'soft') + '"><td><b style="color:var(--ink)">' + escapeHtml(p.nome) + '</b>' + (p.ativo ? '' : ' <span class="tag">inativo</span>') + '</td><td>' + (p.tipo === 'extra' ? 'Número extra' : 'Principal') + '</td><td><code>' + escapeHtml(p.hotmart_produto) + '</code></td><td class="small">' + escapeHtml(p.hotmart_oferta || 'qualquer') + '</td><td>' + (p.tipo === 'extra' ? '+' : '') + p.numeros + '</td><td>' + p.ativas + '</td><td><button class="btn btn-sm" onclick=\'plano(' + JSON.stringify(p).replace(/'/g, '&#39;') + ')\'>Editar</button></td></tr>').join('') || '<tr><td colspan="7"><div class="empty"><b>Nenhum plano</b></div></td></tr>'}</tbody></table></div>`;
}
window.plano = (p = {}) => {
  openModal(`<div class="field"><label for="pn">Nome</label><input class="input" id="pn" value="${escapeHtml(p.nome || '')}" placeholder="Ex.: IA ZAP Mensal"></div>
    <div class="row"><div class="field"><label for="pt">Tipo</label><select class="select" id="pt"><option value="base">Principal</option><option value="extra" ${p.tipo === 'extra' ? 'selected' : ''}>Número extra</option></select></div><div class="field"><label for="pq">Números</label><input type="number" min="1" class="input" id="pq" value="${p.numeros || 1}"></div></div>
    <div class="row"><div class="field"><label for="pp">ID do produto na Hotmart</label><input class="input" id="pp" value="${escapeHtml(p.hotmart_produto || '')}" placeholder="Ex.: 1234567"></div><div class="field"><label for="po">Código da oferta (opcional)</label><input class="input" id="po" value="${escapeHtml(p.hotmart_oferta || '')}" placeholder="Em branco: qualquer oferta"></div></div>
    ${p.id ? '<label class="check"><input type="checkbox" id="pa" ' + (p.ativo ? 'checked' : '') + '>Plano ativo</label>' : ''}`,
    { title: p.id ? 'Editar plano' : 'Novo plano', footer: '<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" id="pgo">Salvar</button>' });
  q('pgo').onclick = async () => { try { await adm('/planos' + (p.id ? '/' + p.id : ''), { method: p.id ? 'PUT' : 'POST', body: { nome: q('pn').value, tipo: q('pt').value, numeros: +q('pq').value, hotmart_produto: q('pp').value, hotmart_oferta: q('po').value, ativo: p.id ? q('pa').checked : true } }); closeModal(); toast('Plano salvo', 'ok'); planos(); } catch (e) { toast(e.message, 'err'); } };
};

async function suporte() {
  const r = await adm('/suporte?status=' + (window._todos ? 'todos' : 'abertos'));
  q('area').innerHTML = `<div style="display:flex;justify-content:space-between;margin-bottom:12px"><label class="check"><input type="checkbox" ${window._todos ? 'checked' : ''} onchange="window._todos=this.checked;suporte()">Mostrar fechados</label></div>
    <div class="panel" style="overflow-x:auto"><table class="tbl"><thead><tr><th>Chamado</th><th>Conta</th><th>Status</th><th>Atualizado</th></tr></thead><tbody>
    ${r.tickets.map(t => '<tr style="cursor:pointer" onclick="ticket(\'' + t.id + '\')"><td><b style="color:var(--ink)">' + escapeHtml(t.assunto) + '</b>' + (t.ultima_msg_autor === 'cliente' && t.status !== 'fechado' ? ' <span class="pill pill-warn">aguardando você</span>' : '') + '</td><td class="small">' + escapeHtml(t.conta) + '<div class="soft">' + escapeHtml(t.email || '') + '</div></td><td class="small">' + t.status + '</td><td class="small">' + fmtRel(t.atualizado_em) + '</td></tr>').join('') || '<tr><td colspan="4"><div class="empty"><b>Nenhum chamado</b></div></td></tr>'}</tbody></table></div>`;
}
window.suporte = suporte;
window.ticket = async (id) => {
  const r = await adm('/suporte/' + id);
  openModal('<div class="small soft" style="margin-bottom:8px">' + escapeHtml(r.ticket.conta) + '</div><div style="max-height:45vh;overflow:auto">' + r.mensagens.map(m => '<div style="background:' + (m.autor === 'suporte' ? 'var(--brand-lt)' : 'var(--bg)') + ';border-radius:10px;padding:10px 12px;margin-bottom:8px"><div class="small" style="font-weight:600">' + escapeHtml(m.user_nome || m.autor) + ' <span class="soft">· ' + fmtDate(m.criado_em) + '</span></div><div style="white-space:pre-wrap;margin-top:4px">' + escapeHtml(m.texto) + '</div></div>').join('') + '</div><div class="field" style="margin-top:10px"><label for="rr">Resposta</label><textarea class="textarea" id="rr" style="min-height:110px"></textarea><div class="hint">O cliente recebe por e-mail e WhatsApp.</div></div>',
    { title: r.ticket.assunto, wide: true, footer: '<button class="btn" onclick="closeModal()">Voltar</button><button class="btn" id="rf">Responder e fechar</button><button class="btn btn-primary" id="rg">Responder</button>' });
  const env = async (fechar) => { try { await adm('/suporte/' + id + '/responder', { method: 'POST', body: { texto: q('rr').value, fechar } }); closeModal(); toast('Resposta enviada', 'ok'); suporte(); } catch (e) { toast(e.message, 'err'); } };
  q('rg').onclick = () => env(false); q('rf').onclick = () => env(true);
};

async function config() {
  const r = await adm('/config'); const c = r.config, cap = r.capacidade;
  const painel = new URL('.', location.href).href;
  if (!c.painel_url) { await adm('/config', { method: 'PUT', body: { painel_url: painel } }); return config(); }
  const hook = c.hotmart_token ? window.API.replace(/\/$/, '') + '/hotmart/' + c.hotmart_token : '(salve uma vez para gerar)';
  q('area').innerHTML = `
    <div class="panel"><div class="panel-head"><div><h3>Hotmart</h3><p>Em Ferramentas → Webhook (API e notificações), crie uma configuração com este endereço e marque os eventos de compra aprovada, completa, atrasada, cancelada, reembolso, chargeback e cancelamento de assinatura.</p></div></div><div class="panel-body">
      <div class="field"><label>Endereço do webhook</label><div style="display:flex;gap:8px"><input class="input" readonly value="${escapeHtml(hook)}"><button class="btn" onclick="navigator.clipboard.writeText('${hook}').then(()=>toast('Copiado','ok'))">Copiar</button></div></div>
      <div class="row"><div class="field"><label for="c-hot">Hottok (da sua conta Hotmart)</label><input class="input" id="c-hot" value="${escapeHtml(c.hotmart_hottok || '')}"></div><div class="field"><label for="c-tol">Dias de tolerância no atraso</label><input type="number" min="0" max="30" class="input" id="c-tol" value="${c.tolerancia_dias}"></div></div>
      <div class="field"><label for="c-card">Domínio do cardápio digital</label><input class="input" id="c-card" value="${escapeHtml(c.cardapio_dominio || '')}" placeholder="https://cardapio.appiazap.com.br"><div class="hint">Com o domínio preenchido, os links ficam como cardapio.appiazap.com.br/nome-da-empresa. Em branco, usa a página dentro do painel.</div></div>
      <div class="field"><label for="c-ext">Link de checkout do número extra</label><input class="input" id="c-ext" value="${escapeHtml(c.link_numero_extra || '')}" placeholder="https://pay.hotmart.com/..."><div class="hint">Aparece para o cliente em Números. O sistema preenche o e-mail e identifica a conta, então a compra cai na conta certa mesmo se ele usar outro e-mail.</div></div>
      <div class="field"><label for="c-ren">Link para renovar ou pagar</label><input class="input" id="c-ren" value="${escapeHtml(c.link_renovacao || '')}" placeholder="https://pay.hotmart.com/..."><div class="hint">Vai nos avisos de atraso e bloqueio e na tela de login bloqueado.</div></div></div></div>
    <div class="panel"><div class="panel-head"><div><h3>Avisos para clientes</h3><p>Acesso, atraso, bloqueio e respostas do suporte saem por e-mail (Resend) e pelo WhatsApp de um número seu conectado.</p></div></div><div class="panel-body">
      ${r.resend ? '<div class="notice notice-ok">Resend configurada no Worker.</div>' : '<div class="notice notice-err">Sem e-mail: adicione o secret <code>RESEND_KEY</code> no Worker (Settings → Variables and Secrets) e verifique o domínio do remetente na Resend.</div>'}
      <div class="row"><div class="field"><label for="c-rem">Remetente do e-mail</label><input class="input" id="c-rem" value="${escapeHtml(c.email_remetente || '')}" placeholder="IA ZAP &lt;acesso@seudominio.com.br&gt;"></div>
        <div class="field"><label for="c-num">Número que envia os avisos no WhatsApp</label><select class="select" id="c-num"><option value="">Não enviar por WhatsApp</option>${r.numeros_conectados.map(n => '<option value="' + n.id + '" ' + (n.id === c.suporte_numero_id ? 'selected' : '') + '>' + escapeHtml(n.conta + ' · ' + n.nome + ' · ' + fmtPhone(n.numero)) + '</option>').join('')}</select></div></div>
      <div class="row"><div class="field"><label for="c-adm">Seu WhatsApp (alerta de chamado novo)</label><input class="input" id="c-adm" value="${escapeHtml(c.admin_whatsapp || '')}" placeholder="51999999999"></div>
        <div class="field"><label for="c-pai">Endereço do painel</label><input class="input" id="c-pai" value="${escapeHtml(c.painel_url)}"><div class="hint">Base dos links de acesso enviados.</div></div></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><input class="input" id="t-e" placeholder="e-mail de teste" style="max-width:220px"><input class="input" id="t-w" placeholder="WhatsApp de teste" style="max-width:180px"><select class="select" id="t-m" style="max-width:220px"><option value="teste">E-mail de teste</option><option value="boas_vindas">Boas-vindas</option><option value="pagamento_pendente">Pagamento pendente</option><option value="acesso_pausado">Acesso pausado</option><option value="reativado">Acesso reativado</option><option value="numero_extra">Número extra liberado</option><option value="suporte_resposta">Resposta do suporte</option><option value="redefinir_senha">Redefinir senha</option></select><button class="btn" onclick="testar()">Enviar teste</button></div></div></div>
    <div class="panel"><div class="panel-head"><div><h3>Capacidade do servidor de WhatsApp</h3><p>Quantos números a Evolution aguenta com folga. Ao chegar no limite, novas conexões são recusadas com aviso para o cliente.</p></div></div><div class="panel-body">
      <div class="barra" style="height:12px"><i style="width:${Math.min(100, cap.pct)}%;background:${cap.pct >= 90 ? 'var(--danger)' : cap.pct >= 75 ? 'var(--warn)' : 'var(--brand)'}"></i></div>
      <p class="small" style="margin:8px 0 12px"><b>${cap.usados}</b> números criados (${cap.conectados} conectados) de <b>${cap.limite}</b> · ${cap.livre} vaga(s)${cap.pct >= 75 ? ' · <b style="color:var(--danger)">hora de planejar outro servidor</b>' : ''}</p>
      <div class="field" style="max-width:220px"><label for="c-evo">Limite de números</label><input type="number" min="1" class="input" id="c-evo" value="${cap.limite}"></div></div></div>
    <div class="panel"><div class="panel-head"><div><h3>Termos de uso e privacidade</h3><p>Versão atual: ${c.termos_versao}. Publicar nova versão pede aceite de novo a todos os donos de conta no próximo acesso.</p></div></div><div class="panel-body">
      <div class="field"><label for="c-ter">Termos de uso</label><textarea class="textarea" id="c-ter" style="min-height:200px">${escapeHtml(c.termos_texto)}</textarea></div>
      <div class="field"><label for="c-pri">Política de privacidade</label><textarea class="textarea" id="c-pri" style="min-height:140px">${escapeHtml(c.privacidade_texto)}</textarea></div>
      <label class="check"><input type="checkbox" id="c-nv">Publicar como nova versão (pede novo aceite)</label><div class="hint">Página pública: ${escapeHtml(new URL('termos.html', painel).href)}</div></div></div>
    <div style="position:sticky;bottom:0;background:var(--bg);padding:12px 0;text-align:right"><button class="btn btn-primary btn-lg" id="c-sv">Salvar configurações</button></div>`;
  q('c-sv').onclick = async (ev) => { btnLoading(ev.currentTarget, true, 'Salvando…');
    try { await adm('/config', { method: 'PUT', body: { cardapio_dominio: q('c-card').value, link_numero_extra: q('c-ext').value, hotmart_hottok: q('c-hot').value, tolerancia_dias: q('c-tol').value, link_renovacao: q('c-ren').value, email_remetente: q('c-rem').value, suporte_numero_id: q('c-num').value, admin_whatsapp: q('c-adm').value, painel_url: q('c-pai').value, evo_limite: q('c-evo').value, termos_texto: q('c-ter').value, privacidade_texto: q('c-pri').value, nova_versao_termos: q('c-nv').checked } }); toast('Configurações salvas', 'ok'); config(); }
    catch (e) { toast(e.message, 'err'); btnLoading(null, false); } };
}
window.testar = async () => { try { const r = await adm('/config/testar-aviso', { method: 'POST', body: { email: q('t-e').value, telefone: q('t-w').value, modelo: q('t-m').value } }); toast('E-mail: ' + (r.email === null ? '—' : r.email ? 'ok' : 'falhou') + ' · WhatsApp: ' + (r.whats === null ? '—' : r.whats ? 'ok' : 'falhou'), r.email === false || r.whats === false ? 'err' : 'ok'); } catch (e) { toast(e.message, 'err'); } };
</script></body></html>
