<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14A152"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Cpath d=%22M16 2.5C8.5 2.5 2.5 8.3 2.5 15.5c0 2.6.8 5 2.1 7L3 28.5l6.3-1.6A13.7 13.7 0 0 0 16 28.5c7.5 0 13.5-5.8 13.5-13S23.5 2.5 16 2.5z%22 fill=%22%2314A152%22/%3E%3C/svg%3E"><link rel="stylesheet" href="app.css"><script src="config.js"></script><script src="app.js"></script><title>Criar senha — IA ZAP</title></head><body>
<div class="auth"><div class="auth-card"><div id="logo"></div><h1>Criar sua senha</h1><p class="lead">Escolha uma senha com pelo menos 8 caracteres.</p><div id="msg"></div>
<form id="f"><div class="field"><label for="s1">Nova senha</label><input type="password" class="input" id="s1" minlength="8" required autocomplete="new-password"></div>
<div class="field"><label for="s2">Repita a senha</label><input type="password" class="input" id="s2" minlength="8" required autocomplete="new-password"></div>
<button type="submit" class="btn btn-primary btn-lg btn-block" id="go">Salvar senha e entrar</button></form>
<p class="small soft" style="text-align:center;margin-top:14px">Ao continuar, você concorda com os <a href="termos.html" target="_blank" style="text-decoration:underline">termos de uso e a política de privacidade</a>.</p></div></div><div id="toast"></div>
<script>
q('logo').innerHTML = logoHTML();
const T = new URLSearchParams(location.search).get('t');
if (!T) q('msg').innerHTML = '<div class="notice notice-err">Link incompleto. Peça um novo em Esqueci minha senha, na tela de login.</div>';
q('f').onsubmit = async (e) => {
  e.preventDefault();
  if (q('s1').value !== q('s2').value) return toast('As senhas não são iguais', 'err');
  btnLoading(q('go'), true, 'Salvando…');
  try {
    const r = await api('/api/auth/definir-senha', { method: 'POST', noAuth: true, body: { token: T, senha: q('s1').value } });
    const l = await api('/api/auth/login', { method: 'POST', noAuth: true, body: { email: r.email, senha: q('s1').value } });
    IZ.save(l.token); IZ.setNum(''); location.href = 'inicio.html';
  } catch (err) { q('msg').innerHTML = '<div class="notice notice-err">' + escapeHtml(err.message) + '</div>'; btnLoading(q('go'), false); }
};
</script></body></html>
