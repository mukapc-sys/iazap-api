<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14A152"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Cpath d=%22M16 2.5C8.5 2.5 2.5 8.3 2.5 15.5c0 2.6.8 5 2.1 7L3 28.5l6.3-1.6A13.7 13.7 0 0 0 16 28.5c7.5 0 13.5-5.8 13.5-13S23.5 2.5 16 2.5z%22 fill=%22%2314A152%22/%3E%3C/svg%3E"><link rel="stylesheet" href="app.css"><script src="config.js"></script><script src="app.js"></script><title>Conversas — IA ZAP</title></head><body>
<script>
if (!requireAuth()) throw new Error('auth');

let filtro = 'todas', ativo = null, contatos = [], mensagens = [], contato = null, buscaT = null;

(async () => {
  await loadMe();
  renderShell('inbox', { title: 'Conversas' });
  document.body.classList.add('pagina-inbox');
  q('content').style.padding = '0';
  q('content').innerHTML = `
    <div class="inbox" id="ix">
      <section class="ix-list">
        <div class="ix-head"><input class="input" id="ix-q" placeholder="Buscar nome ou telefone" aria-label="Buscar conversa"></div>
        <div class="ix-filters" id="ix-f"></div>
        <div class="ix-scroll" id="ix-s"><div class="empty"><div class="spinner"></div></div></div>
      </section>
      <section class="conv" id="cv"><div class="conv-empty"><div><b style="color:var(--ink);display:block;margin-bottom:4px">Nenhuma conversa aberta</b>Escolha uma conversa na lista.</div></div></section>
      <aside class="side hidden" id="sd"></aside>
    </div>`;
  q('ix-q').oninput = () => { clearTimeout(buscaT); buscaT = setTimeout(lista, 250); };
  const alvo = new URLSearchParams(location.search).get('c');
  await lista();
  if (alvo) abrir(alvo);
  setInterval(tick, 8000);
})();

function filtros(t = {}) {
  const f = [['todas', 'Todas'], ['nao_lidas', 'Não lidas'], ['humano', 'Com humano'], ['arquivadas', 'Arquivadas']];
  q('ix-f').innerHTML = f.map(([k, l]) => '<button class="ix-f ' + (k === filtro ? 'on' : '') + '" onclick="setFiltro(\'' + k + '\')">' + l + (t[k] ? '<em>' + t[k] + '</em>' : '') + '</button>').join('');
}
window.setFiltro = (k) => { filtro = k; lista(); };

async function lista() {
  const p = new URLSearchParams({ filtro });
  const b = q('ix-q').value.trim(); if (b) p.set('q', b);
  try {
    const r = await api('/api/inbox?' + p);
    contatos = r.contatos; filtros(r.totais || {}); renderLista();
  } catch (e) { q('ix-s').innerHTML = '<div class="empty">' + escapeHtml(e.message) + '</div>'; }
}

function renderLista() {
  if (!contatos.length) {
    const vazio = filtro === 'todas' && !q('ix-q').value
      ? '<b>Nenhuma conversa ainda</b>Quando um cliente mandar mensagem para o WhatsApp conectado, ela aparece aqui.'
      : '<b>Nada por aqui</b>Nenhuma conversa neste filtro.';
    q('ix-s').innerHTML = '<div class="empty">' + vazio + '</div>'; return;
  }
  q('ix-s').innerHTML = contatos.map(c => `
    <div class="ix-item ${c.id === ativo ? 'active' : ''}" onclick="abrir('${c.id}')" role="button" tabindex="0" onkeydown="if(event.key==='Enter')abrir('${c.id}')">
      <div class="avatar">${initial(c.nome || c.telefone)}</div>
      <div style="min-width:0">
        <div class="ix-name">${escapeHtml(c.nome || fmtPhone(c.telefone))}</div>
        <div class="ix-prev">${c.ultima_msg_dir === 'out' ? '✓ ' : ''}${escapeHtml(c.ultima_msg_prev || '')}</div>
      </div>
      <div class="ix-meta">
        <span>${fmtRel(c.ultima_msg_em)}</span>
        ${c.nao_lidas > 0 ? '<span class="n">' + c.nao_lidas + '</span>' : c.ia_pausada ? '<span class="ix-human">humano</span>' : ''}
      </div>
    </div>`).join('');
}

window.abrir = async (cid) => {
  ativo = cid; renderLista();
  q('ix').classList.add('has-conv');
  q('cv').innerHTML = '<div class="conv-empty"><div class="spinner"></div></div>';
  try {
    const r = await api('/api/contacts/' + cid + '/conversation');
    contato = r.contato; mensagens = r.mensagens;
    renderConversa(); renderSide();
    if (contato.nao_lidas > 0) {
      api('/api/contacts/' + cid + '/read', { method: 'POST' }).then(() => { const c = contatos.find(x => x.id === cid); if (c) { c.nao_lidas = 0; renderLista(); } atualizarBadge(); });
    }
  } catch (e) { q('cv').innerHTML = '<div class="conv-empty">' + escapeHtml(e.message) + '</div>'; }
};

function renderConversa() {
  const c = contato;
  q('cv').innerHTML = `
    <div class="conv-head">
      <button class="icon-btn mobile-menu" style="display:none" id="cv-back" aria-label="Voltar">${icon('back', 20)}</button>
      <div class="avatar">${initial(c.nome || c.telefone)}</div>
      <div class="grow"><div style="font-weight:700;color:var(--ink)">${escapeHtml(c.nome || fmtPhone(c.telefone))}</div><div class="small soft">${fmtPhone(c.telefone)}</div></div>
    </div>
    ${c.ia_pausada ? '<div class="conv-bar"><span>Atendimento humano: a IA não responde nesta conversa.</span><button class="btn btn-sm" onclick="setIA(false)">Devolver para a IA</button></div>' : ''}
    <div class="conv-scroll" id="cv-s"></div>
    <div id="cv-prog"></div>
    <div class="conv-input">
      <button class="icon-btn" title="Enviar foto, vídeo ou documento" aria-label="Anexar arquivo" onclick="q('cv-f').click()">${icon('clip', 22)}</button>
      <input type="file" id="cv-f" class="hidden" accept="image/*,video/*,audio/*,application/pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.csv,.zip">
      <textarea id="cv-t" rows="1" placeholder="Digite uma mensagem" aria-label="Mensagem"></textarea>
      <span class="rec-time hidden" id="cv-rt"></span>
      <button class="icon-btn hidden" id="cv-rx" title="Descartar gravação" aria-label="Descartar gravação">${icon('x', 20)}</button>
      <button class="icon-btn" id="cv-ag" title="Programar mensagem" aria-label="Programar mensagem">${icon('clock', 21)}</button>
      <button class="icon-btn" id="cv-mic" title="Gravar áudio" aria-label="Gravar áudio">${icon('mic', 21)}</button>
      <button class="icon-btn send" id="cv-go" aria-label="Enviar">${icon('send', 20)}</button>
    </div>`;
  if (matchMedia('(max-width:860px)').matches) { q('cv-back').style.display = 'grid'; q('cv-back').onclick = () => { ativo = null; q('ix').classList.remove('has-conv'); renderLista(); }; }
  const t = q('cv-t');
  t.addEventListener('input', () => { t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 140) + 'px'; });
  t.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); enviar(); } });
  q('cv-go').onclick = enviar;
  q('cv-f').onchange = (e) => { const f = e.target.files[0]; e.target.value = ''; if (f) previewAnexo(f); };
  t.addEventListener('paste', (e) => { const f = [...(e.clipboardData?.files || [])][0]; if (f) { e.preventDefault(); previewAnexo(f); } });
  q('cv-mic').onclick = gravar;
  q('cv-ag').onclick = programar;
  carregarProgramadas();
  q('cv-rx').onclick = () => pararGravacao(false);
  renderMsgs();
  t.focus();
}

function renderMsgs(manterScroll) {
  const box = q('cv-s'); if (!box) return;
  const noFim = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
  if (!mensagens.length) { box.innerHTML = '<div class="conv-day">Sem mensagens salvas</div>'; return; }
  let dia = '', html = '';
  const hoje = new Date().toLocaleDateString('pt-BR');
  const ontem = new Date(Date.now() - 864e5).toLocaleDateString('pt-BR');
  for (const m of mensagens) {
    const d = parseDate(m.criado_em), ds = d.toLocaleDateString('pt-BR');
    if (ds !== dia) { dia = ds; html += '<div class="conv-day">' + (ds === hoje ? 'Hoje' : ds === ontem ? 'Ontem' : ds) + '</div>'; }
    const out = m.direcao === 'out';
    const who = !out ? '' : m.autor === 'ia' ? '<div class="who">IA</div>' : m.autor === 'celular' ? '<div class="who phone">Pelo celular</div>' : m.autor === 'lembrete' ? '<div class="who">Lembrete automático</div>' : m.autor === 'followup' ? '<div class="who">Follow-up automático</div>' : m.autor === 'campanha' ? '<div class="who">Campanha</div>' : m.autor === 'integracao' ? '<div class="who">Integração</div>' : m.autor === 'sistema' ? '<div class="who">Aviso automático</div>' : m.autor === 'agendada' ? '<div class="who">Programada' + (m.atendente ? ' por ' + escapeHtml(m.atendente) : '') + '</div>' : m.atendente ? '<div class="who">' + escapeHtml(m.atendente) + '</div>' : '';
    const st = out ? ({ enviado: ' ✓', entregue: ' ✓✓', lida: ' ✓✓', falhou: ' · falhou' }[m.status] || '') : '';
    const md = midiaHtml(m), txt = textoSemRotulo(m);
    html += `<div class="bubble ${out ? 'out' : 'in'} ${m.status === 'falhou' ? 'fail' : ''}" ${m.erro ? 'title="' + escapeHtml(m.erro) + '"' : ''}>${who}${md}${txt ? '<div class="txt">' + escapeHtml(txt) + '</div>' : ''}<div class="meta">${d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}${st}</div></div>`;
  }
  box.innerHTML = html;
  if (!manterScroll || noFim) box.scrollTop = box.scrollHeight;
}

const TIPOS_MIDIA = ['image', 'video', 'audio', 'document', 'sticker'];
function midiaHtml(m) {
  const u = m.media_url ? escapeHtml(m.media_url) : null, mime = m.media_mime || '';
  if (!u) {
    if (!TIPOS_MIDIA.includes(m.tipo)) return '';
    const recente = m.criado_em && Date.now() - parseDate(m.criado_em) < 90000;
    return '<div class="b-miss">' + (recente && !m.erro ? 'Carregando mídia…' : 'Mídia não disponível') + '</div>';
  }
  if (m.tipo === 'sticker') return '<img class="b-sticker" src="' + u + '" alt="Figurinha" loading="lazy">';
  if (mime.startsWith('image/')) return '<img class="b-img" src="' + u + '" alt="Imagem" loading="lazy" onclick="zoom(this.src)">';
  if (mime.startsWith('audio/')) return '<audio controls preload="none" src="' + u + '"></audio>';
  if (mime.startsWith('video/')) return '<video controls preload="metadata" src="' + u + '"></video>';
  return '<a class="b-doc" href="' + u + '" target="_blank" rel="noopener">' + icon('clip', 20) + '<span>' + escapeHtml(m.media_nome || 'Documento') + '<small>' + (m.media_tam ? fmtBytes(m.media_tam) : '') + '</small></span></a>';
}
function textoSemRotulo(m) {
  let t = m.conteudo || '';
  if (!TIPOS_MIDIA.includes(m.tipo)) return t;
  t = t.replace(/^(📷|🎥|🎤|🎵|📄|💠|📎)\s*/u, '');
  if (m.media_nome && t.startsWith(m.media_nome)) t = t.slice(m.media_nome.length);
  t = t.trim();
  return ['Imagem', 'Vídeo', 'Mensagem de voz', 'Áudio', 'Figurinha', 'Documento'].includes(t) ? '' : t;
}
window.zoom = (src) => { const d = document.createElement('div'); d.className = 'lightbox'; d.innerHTML = '<img src="' + src + '" alt="">'; d.onclick = () => d.remove(); document.body.appendChild(d); };

function previewAnexo(file) {
  if (file.size > 20 * 1024 * 1024) return toast('Arquivo acima de 20 MB', 'err');
  const url = URL.createObjectURL(file), tipo = file.type || '';
  const prev = tipo.startsWith('image/') ? '<img src="' + url + '" alt="">'
    : tipo.startsWith('video/') ? '<video src="' + url + '" controls></video>'
    : tipo.startsWith('audio/') ? '<audio src="' + url + '" controls></audio>'
    : '<div style="text-align:center">' + icon('clip', 32) + '<div style="font-weight:600;margin-top:6px">' + escapeHtml(file.name) + '</div><div class="small soft">' + fmtBytes(file.size) + '</div></div>';
  openModal('<div class="att-prev">' + prev + '</div>' + (tipo.startsWith('audio/') ? '' : '<div class="field" style="margin:0"><label for="at-c">Legenda</label><input class="input" id="at-c" placeholder="Opcional"></div>'),
    { title: 'Enviar arquivo', wide: true, footer: '<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" id="at-go">Enviar arquivo</button>' });
  q('at-go').onclick = async (ev) => {
    btnLoading(ev.currentTarget, true, 'Enviando…');
    try { await enviarArquivo(file, q('at-c')?.value || ''); closeModal(); URL.revokeObjectURL(url); }
    catch (e) { toast(e.message, 'err'); btnLoading(ev.currentTarget, false); }
  };
}
async function enviarArquivo(file, legenda) {
  const up = await uploadArquivo(file, 'conversa');
  await api('/api/contacts/' + ativo + '/send', { method: 'POST', body: { tipo: 'media', media_key: up.key, legenda, arquivo: up.nome } });
  toast('Arquivo enviado', 'ok');
  if (!contato.ia_pausada) { contato.ia_pausada = 1; renderConversa(); renderSide(); }
  await recarregarConversa(); lista();
}

function paraInputLocal(d) { const x = new Date(d - d.getTimezoneOffset() * 6e4); return x.toISOString().slice(0, 16); }
function programar() {
  const texto = q('cv-t').value.trim();
  const sug = new Date(Date.now() + 3600e3); sug.setMinutes(0, 0, 0);
  openModal(`
    <div class="field"><label for="pg-t">Mensagem</label><textarea class="textarea" id="pg-t" placeholder="Digite o que será enviado">${escapeHtml(texto)}</textarea></div>
    <div class="field"><label for="pg-d">Enviar em</label><input type="datetime-local" class="input" id="pg-d" value="${paraInputLocal(sug)}" min="${paraInputLocal(new Date(Date.now() + 120e3))}" style="max-width:260px">
      <div class="hint">Horário do seu computador. A mensagem sai automaticamente, mesmo com o painel fechado.</div></div>`,
    { title: 'Programar mensagem', footer: '<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" id="pg-go">Programar envio</button>' });
  q('pg-go').onclick = async (ev) => {
    const v = q('pg-d').value; if (!v) return toast('Escolha data e hora', 'err');
    btnLoading(ev.currentTarget, true, 'Programando…');
    try {
      await api('/api/contacts/' + ativo + '/agendar', { method: 'POST', body: { texto: q('pg-t').value, enviar_em: new Date(v).toISOString() } });
      closeModal(); if (q('cv-t').value.trim() === q('pg-t').value.trim()) q('cv-t').value = '';
      toast('Mensagem programada para ' + new Date(v).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }), 'ok');
      carregarProgramadas();
    } catch (e) { toast(e.message, 'err'); btnLoading(ev.currentTarget, false); }
  };
}
async function carregarProgramadas() {
  const box = q('cv-prog'); if (!box || !ativo) return;
  try {
    const r = await api('/api/agendadas?status=pendente&contato=' + ativo);
    box.innerHTML = r.agendadas.length ? '<div class="prog-bar">' + r.agendadas.map(x => '<div class="prog-item">' + icon(x.tipo === 'lembrete' ? 'bell' : 'clock', 15) + '<span><b>' + fmtDate(x.enviar_em) + '</b> · ' + escapeHtml(x.tipo === 'lembrete' ? 'Lembrete da marcação' : (x.texto || '').slice(0, 80)) + '</span>' + (x.tipo === 'manual' ? '<button class="sb-link" onclick="cancelarProg(\'' + x.id + '\')">Cancelar</button>' : '') + '</div>').join('') + '</div>' : '';
  } catch { box.innerHTML = ''; }
}
window.cancelarProg = async (id) => {
  if (!confirm('Cancelar esta mensagem programada?')) return;
  try { await api('/api/agendadas/' + id, { method: 'DELETE' }); toast('Mensagem cancelada', 'ok'); carregarProgramadas(); } catch (e) { toast(e.message, 'err'); }
};

let gravador = null, pedacos = [], gravT = null;
async function gravar() {
  if (gravador) return pararGravacao(true);
  if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) return toast('Seu navegador não grava áudio', 'err');
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch { return toast('Permita o uso do microfone para gravar', 'err'); }
  const tipo = ['audio/ogg;codecs=opus', 'audio/webm;codecs=opus', 'audio/mp4'].find(t => MediaRecorder.isTypeSupported(t)) || '';
  gravador = new MediaRecorder(stream, tipo ? { mimeType: tipo } : undefined);
  pedacos = []; gravador.ondataavailable = (e) => e.data.size && pedacos.push(e.data);
  gravador.start();
  const ini = Date.now();
  q('cv-mic').classList.add('rec'); q('cv-mic').innerHTML = icon('send', 20); q('cv-mic').title = 'Enviar áudio';
  q('cv-rt').classList.remove('hidden'); q('cv-rx').classList.remove('hidden'); q('cv-t').classList.add('hidden'); q('cv-go').classList.add('hidden');
  const tick = () => { const s = Math.floor((Date.now() - ini) / 1000); q('cv-rt').textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); if (s >= 300) pararGravacao(true); };
  tick(); gravT = setInterval(tick, 500);
}
function pararGravacao(enviarAudio) {
  if (!gravador) return;
  const g = gravador; gravador = null; clearInterval(gravT);
  g.onstop = async () => {
    g.stream.getTracks().forEach(t => t.stop());
    ['cv-rt', 'cv-rx'].forEach(id => q(id)?.classList.add('hidden')); q('cv-t')?.classList.remove('hidden'); q('cv-go')?.classList.remove('hidden');
    if (q('cv-mic')) { q('cv-mic').classList.remove('rec'); q('cv-mic').innerHTML = icon('mic', 21); q('cv-mic').title = 'Gravar áudio'; }
    if (!enviarAudio || !pedacos.length) return;
    const tipo = (g.mimeType || 'audio/webm').split(';')[0];
    const ext = { 'audio/ogg': 'ogg', 'audio/webm': 'weba', 'audio/mp4': 'm4a' }[tipo] || 'weba';
    const file = new File(pedacos, 'audio.' + ext, { type: tipo });
    toast('Enviando áudio…');
    try { await enviarArquivo(file, ''); } catch (e) { toast(e.message, 'err'); }
  };
  g.stop();
}

async function enviar() {
  const t = q('cv-t'), texto = t.value.trim();
  if (!texto) return;
  t.value = ''; t.style.height = 'auto';
  const temp = { direcao: 'out', autor: 'humano', conteudo: texto, status: 'enviando', criado_em: new Date().toISOString() };
  mensagens.push(temp); renderMsgs();
  try {
    await api('/api/contacts/' + ativo + '/send', { method: 'POST', body: { tipo: 'text', texto } });
    temp.status = 'enviado';
    if (!contato.ia_pausada) { contato.ia_pausada = 1; renderConversa(); renderSide(); } else renderMsgs();
    lista();
  } catch (e) { temp.status = 'falhou'; temp.erro = e.message; renderMsgs(); toast(e.message, 'err'); }
}

function renderSide() {
  const c = contato, sd = q('sd');
  sd.classList.remove('hidden');
  sd.innerHTML = `
    <div class="center"><div class="avatar">${initial(c.nome || c.telefone)}</div>
      <div style="font-weight:700;color:var(--ink)">${escapeHtml(c.nome || '')}</div><div class="small soft">${fmtPhone(c.telefone)}</div></div>
    <div class="side-toggle">
      <div><div style="font-weight:600;color:var(--ink);font-size:13px">IA nesta conversa</div><div class="small soft">${c.ia_pausada ? 'Pausada: humano atendendo' : 'Ativa'}</div></div>
      <label class="switch"><input type="checkbox" ${c.ia_pausada ? '' : 'checked'} onchange="setIA(!this.checked)"><span></span></label>
    </div>
    <h4>Nome</h4><input class="input" id="sd-n" value="${escapeHtml(c.nome || '')}">
    <h4>Etiquetas</h4><div id="sd-tags"></div>
    <input class="input" id="sd-tg" placeholder="Nova etiqueta e Enter" style="margin-top:4px">
    <h4>Anotações</h4><textarea class="textarea" id="sd-nota" placeholder="Visível só para a equipe">${escapeHtml(c.nota || '')}</textarea>
    <h4>O que a IA lembra deste cliente</h4><textarea class="textarea" id="sd-mem" placeholder="A IA preenche sozinha com preferências e histórico" style="min-height:80px">${escapeHtml(c.memoria || '')}</textarea>
    <div class="side-toggle" style="margin-top:12px"><div><div style="font-weight:600;color:var(--ink);font-size:13px">Recebe campanhas e follow-ups</div><div class="small soft">${c.optout ? 'Pediu para não receber' : 'Sim'}</div></div>
      <label class="switch"><input type="checkbox" ${c.optout ? '' : 'checked'} onchange="patch({ optout: !this.checked }).then(() => { toast(this.checked ? 'Voltou a receber' : 'Não recebe mais campanhas', 'ok'); })"><span></span></label></div>
    <div style="margin-top:18px"><button class="btn btn-sm btn-block" onclick="arquivar()">${c.arquivado ? 'Desarquivar conversa' : 'Arquivar conversa'}</button></div>`;
  renderTags();
  q('sd-n').onchange = (e) => patch({ nome: e.target.value }).then(lista);
  q('sd-nota').onchange = (e) => patch({ nota: e.target.value }).then(() => toast('Anotação salva', 'ok'));
  q('sd-mem').onchange = (e) => patch({ memoria: e.target.value }).then(() => toast('Memória da IA atualizada', 'ok'));
  q('sd-tg').onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); const v = e.target.value.trim(); if (!v) return; contato.tags = [...new Set([...(contato.tags || []), v])]; e.target.value = ''; renderTags(); patch({ tags: contato.tags }); } };
}
function renderTags() {
  q('sd-tags').innerHTML = (contato.tags || []).map((t, i) => '<span class="tag">' + escapeHtml(t) + '<button onclick="delTag(' + i + ')" aria-label="Remover etiqueta">×</button></span>').join('') || '<span class="small soft">Sem etiquetas</span>';
}
window.delTag = (i) => { contato.tags.splice(i, 1); renderTags(); patch({ tags: contato.tags }); };
async function patch(body) { try { await api('/api/contacts/' + ativo, { method: 'PATCH', body }); } catch (e) { toast(e.message, 'err'); throw e; } }
window.setIA = async (pausar) => {
  await patch({ ia_pausada: pausar });
  contato.ia_pausada = pausar ? 1 : 0;
  renderConversa(); renderSide(); lista();
  toast(pausar ? 'IA pausada nesta conversa' : 'Conversa devolvida para a IA', 'ok');
};
window.arquivar = async () => {
  await patch({ arquivado: !contato.arquivado });
  toast(contato.arquivado ? 'Conversa desarquivada' : 'Conversa arquivada', 'ok');
  ativo = null; q('ix').classList.remove('has-conv'); q('sd').classList.add('hidden');
  q('cv').innerHTML = '<div class="conv-empty">Escolha uma conversa na lista.</div>'; lista();
};

async function recarregarConversa() {
  if (!ativo) return;
  try {
    const r = await api('/api/contacts/' + ativo + '/conversation');
    const assin = (arr) => JSON.stringify(arr.filter(m => m.id).map(m => [m.id, m.status, !!m.media_url]));
    const mudou = assin(r.mensagens) !== assin(mensagens);
    if (mudou) { mensagens = r.mensagens; renderMsgs(true); carregarProgramadas(); }
    if (r.contato.nao_lidas > 0) api('/api/contacts/' + ativo + '/read', { method: 'POST' });
    if (!!r.contato.ia_pausada !== !!contato.ia_pausada) { contato = r.contato; renderConversa(); renderSide(); }
  } catch { }
}
async function tick() {
  if (document.hidden) return;
  const focado = document.activeElement && document.activeElement.id;
  await lista();
  await recarregarConversa();
  atualizarBadge();
  if (focado && q(focado)) q(focado).focus();
}
</script>
</body></html>
