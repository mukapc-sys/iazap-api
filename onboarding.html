<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14A152"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Cpath d=%22M16 2.5C8.5 2.5 2.5 8.3 2.5 15.5c0 2.6.8 5 2.1 7L3 28.5l6.3-1.6A13.7 13.7 0 0 0 16 28.5c7.5 0 13.5-5.8 13.5-13S23.5 2.5 16 2.5z%22 fill=%22%2314A152%22/%3E%3C/svg%3E"><link rel="stylesheet" href="app.css"><script src="config.js"></script><script src="app.js"></script><script src="empresa-form.js"></script><title>Configuração inicial — IA ZAP</title></head><body>
<div class="ob">
  <div class="ob-top"><div id="logo"></div><div style="display:flex;gap:8px;align-items:center"><span class="small muted" id="ob-num"></span><a class="btn btn-ghost btn-sm hidden" id="ob-outros" href="numeros.html">Meus números</a><button class="btn btn-ghost btn-sm" onclick="logout()">Sair</button></div></div>
  <div class="ob-main"><div class="ob-inner">
    <div class="ob-progress" id="prog"></div>
    <div id="step"></div>
  </div></div>
</div>
<div id="toast"></div>
<script>
if (!requireAuth()) throw new Error('auth');
q('logo').innerHTML = logoHTML();

let me = null, etapa = 1, escolhido = null, wa = null, form = null;
const TOTAL = 3;

(async () => {
  try { me = await loadMe({ skipOnboarding: true }); }
  catch (e) { q('step').innerHTML = '<div class="notice notice-err">' + escapeHtml(e.message) + '</div>'; return; }
  if (me.account.onboarding_ok && me.account.modelo) return location.replace('inicio.html');
  if (me.numero) q('ob-num').textContent = 'Configurando: ' + me.numero.nome;
  if ((me.numeros || []).length > 1) q('ob-outros').classList.remove('hidden');
  etapa = me.account.modelo ? 2 : 1;
  render();
})();

function progress() {
  q('prog').innerHTML = Array.from({ length: TOTAL }, (_, i) => '<div class="' + (i < etapa ? 'on' : '') + '"></div>').join('');
}
function render() {
  if (wa) { wa.stop(); wa = null; }
  progress();
  window.scrollTo(0, 0);
  ({ 1: passoModelo, 2: passoEmpresa, 3: passoWhats })[etapa]();
}

let presets = null, presetEscolhido = null;
const DESC_PRESET = { barbearia: 'Cortes, barba e horários com os barbeiros.', clinica: 'Consultas médicas e nutrição, com cuidados de saúde na IA.', terapeuta: 'Sessões de psicologia, com sigilo e protocolo de crise.', dentista: 'Avaliação, tratamentos e urgência odontológica.', advocacia: 'Triagem e consultas, sem parecer jurídico pela IA.', imobiliaria: 'Imóveis para venda e aluguel, com visitas agendadas.', delivery: 'Cardápio, pedidos com entrega e cardápio digital.', varejo: 'Loja com catálogo, fotos e vendedor humano.', ecommerce: 'Loja online com link de compra e recuperação de vendas.' };
const ICONE_PRESET = { barbearia: 'scissors', clinica: 'heart', dentista: 'spark', terapeuta: 'chat', advocacia: 'building', imobiliaria: 'building', delivery: 'bag', varejo: 'store', ecommerce: 'box' };
async function passoModelo() {
  if (!presets) { try { presets = (await api('/api/modelos')).modelos; } catch { presets = []; } }
  const card = (on, onclick, ic, titulo, desc, extra) => `<button type="button" class="model ${on ? 'on' : ''}" onclick="${onclick}" aria-pressed="${on}"><div class="model-ic">${icon(ic, 24)}</div><h3>${titulo}</h3><p>${desc}</p>${extra || ''}</button>`;
  q('step').innerHTML = `
    <div class="ob-step">Passo 1 de ${TOTAL}</div>
    <h1>Qual é o seu tipo de negócio?</h1>
    <p class="lead">Escolha um modelo pronto: o número já vem com regras, perguntas frequentes, horários e serviços ou produtos de exemplo para você só ajustar. Depois de escolher, a troca de segmento só pode ser feita pelo suporte.</p>
    <div class="section-title">Modelos prontos</div>
    <div class="models">${presets.map((p) => card(presetEscolhido === p.chave, `escolherPreset('${p.chave}')`, ICONE_PRESET[p.chave] || 'spark', escapeHtml(p.rotulo), escapeHtml(DESC_PRESET[p.chave] || p.descricao.split('.')[0] + '.'),
      `<div class="model-ex">${p.servicos ? p.servicos + ' serviços de exemplo' : p.produtos + ' produtos de exemplo'} · ${escapeHtml(MODELOS[p.segmento]?.nome || '')}</div>`)).join('')}</div>
    <div class="section-title" style="margin-top:22px">Ou comece do zero</div>
    <div class="models">${Object.entries(MODELOS).map(([k, m]) => card(escolhido === k && !presetEscolhido, `escolher('${k}')`, m.icon, m.nome, m.desc, `<div class="model-ex">${m.ex}</div>`)).join('')}</div>
    <div class="ob-actions"><span></span><button class="btn btn-primary btn-lg" id="go" ${escolhido || presetEscolhido ? '' : 'disabled'}>Continuar</button></div>`;
  q('go').onclick = async (ev) => {
    const nome = presetEscolhido ? presets.find((p) => p.chave === presetEscolhido).rotulo : MODELOS[escolhido].nome;
    if (!confirm('Confirmar "' + nome + '"? O segmento não pode ser trocado por aqui depois.')) return;
    btnLoading(ev.currentTarget, true, 'Preparando…');
    try {
      const r = await api('/api/account/modelo', { method: 'PUT', body: presetEscolhido ? { preset: presetEscolhido } : { modelo: escolhido } });
      me.account.modelo = r.modelo; etapa = 2; render();
      if (presetEscolhido) toast('Modelo aplicado. Revise os dados, os nomes da equipe e os preços.', 'ok');
    } catch (e) { toast(e.message, 'err'); btnLoading(null, false); }
  };
}
window.escolherPreset = (k) => { presetEscolhido = k; escolhido = null; passoModelo(); };
window.escolher = (k) => { escolhido = k; presetEscolhido = null; passoModelo(); };

function passoEmpresa() {
  q('step').innerHTML = `
    <div class="ob-step">Passo 2 de ${TOTAL}</div>
    <h1>Conte sobre a empresa deste número</h1>
    <p class="lead">A IA responde com base nessas informações. Você completa o restante (perguntas frequentes, regras, jeito de falar) depois, em Dados da empresa.</p>
    <div class="panel"><div class="panel-body" id="biz"></div></div>
    <div class="ob-actions"><span class="small soft">Modelo: ${escapeHtml(MODELOS[me.account.modelo].nome)}</span><button class="btn btn-primary btn-lg" id="go">Salvar e continuar</button></div>`;
  form = bizForm(q('biz'), { modelo: me.account.modelo, compact: true });
  q('go').onclick = async (ev) => {
    btnLoading(ev.currentTarget, true, 'Salvando…');
    try { await form.save(); etapa = 3; render(); }
    catch (e) { toast(e.message, 'err'); btnLoading(ev.currentTarget, false); }
  };
}

function passoWhats() {
  q('step').innerHTML = `
    <div class="ob-step">Passo 3 de ${TOTAL}</div>
    <h1>Conecte o WhatsApp deste número</h1>
    <p class="lead">Use o celular do negócio que este número vai atender. A inteligência artificial do Google já vem inclusa: depois de conectar, é só ligar o atendimento.</p>
    <div class="panel" id="wa"></div>
    <div class="ob-actions"><button class="btn btn-ghost" onclick="etapa=2;render()">${icon('back',16)} Voltar</button>
      <div style="display:flex;gap:8px"><button class="btn" id="later">Conectar depois</button><button class="btn btn-primary btn-lg" id="go">Concluir</button></div></div>`;
  wa = mountWhatsapp(q('wa'), { onConnected: () => { q('go').focus(); } });
  const fim = async (ev) => {
    btnLoading(ev.currentTarget, true, 'Concluindo…');
    try { await api('/api/account/onboarding', { method: 'POST' }); sessionStorage.removeItem('iz_me'); location.href = 'inicio.html'; }
    catch (e) { toast(e.message, 'err'); btnLoading(ev.currentTarget, false); }
  };
  q('go').onclick = fim; q('later').onclick = fim;
}
</script>
</body></html>
